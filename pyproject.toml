[project]
name = "entailment-judge-api"
version = "0.1.0"
description = "Entailment Judge API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.4",
    "django-environ>=0.13.0",
    "djangorestframework>=3.16.0",
    "drf-spectacular>=0.29.0",
    "psycopg[binary]>=3.3.4",
    "sentence-transformers>=5.5.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.36.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "ruff>=0.12.7",
]

[tool.poe.env]
DJANGO_SETTINGS_MODULE = "judge.settings"

[tool.poe.tasks]
lint = "ruff check --fix ."
format = "ruff format ."
test = "pytest"
coverage = "pytest   --cov=judge --cov=ratelimit --cov=entailment --cov-report=term-missing"
coverage-html = "pytest --cov-report=html"
